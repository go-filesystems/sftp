name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Both modules resolve their dependencies from the module proxy; fat32demo's
  # only local replace points at its own parent. GOWORK=off keeps any developer
  # go.work out of CI regardless.
  GOWORK: off

jobs:
  # ----------------------------------------------------------------------
  # Core module — depends only on go-filesystems/interface, golang.org/x/crypto
  # and the standard library. The 100% coverage gate is enforced here.
  # ----------------------------------------------------------------------
  core-native:
    name: core native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: sftp

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: sftp/go.mod

      - name: Vet
        working-directory: sftp
        run: go vet -mod=mod ./...

      - name: Gofmt
        working-directory: sftp
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Build (CGO disabled — the module must stay pure Go)
        working-directory: sftp
        env:
          CGO_ENABLED: "0"
        run: go build -mod=mod ./...

      - name: Test (race + coverage)
        working-directory: sftp
        run: go test -mod=mod -race -coverpkg=./... -coverprofile=cover.out -covermode=atomic ./...

      - name: Enforce coverage gate
        working-directory: sftp
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 100.0) ? 0 : 1 }' \
            || { echo "coverage ${pct}% below gate 100.0%"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-${{ matrix.arch }}
          path: sftp/cover.out
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Core module — emulated 64-bit arches. SFTP is big-endian on the wire, so
  # s390x is not a formality: it is the arch on which a forgotten
  # binary.BigEndian would still pass on the developer's machine.
  # ----------------------------------------------------------------------
  core-emulated:
    name: core emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu: power9
          - arch: s390x
            image: debian:trixie
            qemu: qemu
    steps:
      - uses: actions/checkout@v7
        with:
          path: sftp

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: sftp/go.mod

      - name: Register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Cross-compile per-package test binaries
        working-directory: sftp
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/tests
          for pkg in $(go list -mod=mod ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            go test -mod=mod -c -cover -o "/tmp/tests/${name}.test" "$pkg"
          done
          ls -la /tmp/tests

      - name: Run test binaries under QEMU (${{ matrix.arch }})
        env:
          QEMU_CPU: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(/tmp/tests/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no test binaries to run"; exit 0
          fi
          rc=0
          for bin in "${bins[@]}"; do
            echo "::group::$(basename "$bin")"
            if ! docker run --rm \
              --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU="${QEMU_CPU}" \
              --user 1000:1000 \
              -v /tmp/tests:/t -w /t \
              ${{ matrix.image }} \
              "./$(basename "$bin")" -test.v; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  # ----------------------------------------------------------------------
  # The module must build for every platform it claims to serve. The point of
  # SFTP is that the CLIENT needs nothing installed; the server still has to
  # run somewhere, and "somewhere" includes Windows.
  # ----------------------------------------------------------------------
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sftp
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: sftp/go.mod
      - name: Build for every advertised platform
        working-directory: sftp
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 \
                        linux/amd64 linux/arm64 freebsd/amd64 openbsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -mod=mod ./...
            echo "ok $target"
          done

  # ----------------------------------------------------------------------
  # fat32demo — the real-image harness. It imports the fat32 driver, so it is
  # its own module, keeping the core module free of any driver dependency.
  #
  # This job is also the END-TO-END PROOF: the tests in demo/ drive the
  # `sftp` binary that ships with OpenSSH against an image the fat32 driver
  # actually formatted, and compare sha256 against what the driver returns
  # through ReadFile. Everything above only shows the server agrees with
  # itself; this shows a real client agrees with it.
  # ----------------------------------------------------------------------
  demo-native:
    name: demo + live sftp client ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: sftp
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: sftp/fat32demo/go.mod

      # The live tests SKIP when these are absent, so a runner without them
      # would turn the end-to-end proof into a silent no-op. Installing them
      # explicitly, and asserting they are there, is what keeps the job honest.
      - name: Install the OpenSSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client

      - name: Assert the client is present (the live tests skip without it)
        run: |
          set -euo pipefail
          command -v sftp
          command -v ssh-keygen
          sftp -V 2>&1 || true

      - name: Vet
        working-directory: sftp/fat32demo
        run: go vet -mod=mod ./...

      - name: Build
        working-directory: sftp/fat32demo
        env:
          CGO_ENABLED: "0"
        run: go build -mod=mod ./...

      # The gate covers ./demo/..., which holds everything the command does.
      # main.go is the signal wiring and one call into demo.Main; it is
      # excluded rather than papered over with a lowered threshold.
      - name: Test (race + coverage, includes the live OpenSSH client)
        working-directory: sftp/fat32demo
        run: go test -mod=mod -race -coverpkg=./demo/... -coverprofile=cover.out -covermode=atomic -timeout 20m ./demo/... -v

      - name: Enforce coverage gate
        working-directory: sftp/fat32demo
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 100.0) ? 0 : 1 }' \
            || { echo "coverage ${pct}% below gate 100.0%"; exit 1; }

      - name: No key material may survive the tests
        run: |
          set -euo pipefail
          # Keys are generated into t.TempDir() and removed with it. This is
          # the check that a future change has not started writing one into
          # the work tree, where a git add -A would publish it.
          found=$(find "$GITHUB_WORKSPACE/sftp" \
            \( -name 'id_*' -o -name '*.pem' -o -name '*_host_key*' -o -name '*.img' \) \
            -print)
          if [ -n "$found" ]; then
            echo "key material or images left in the work tree:"; echo "$found"; exit 1
          fi
          echo "work tree is clean of keys and images"
